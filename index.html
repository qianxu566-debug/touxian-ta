<script type="module">
'use strict';
import {samples,count as measuredCount,difference,earlier,historyText} from './assets/daily.js';
import {dayString,ageDays,compressed,appLink,mobilePlatform} from './assets/reader.js?v=book-reader-3';
const starts=await compressed('./data/book-dates.json.gz').catch(()=>({}));
let age='', submitted='';
const ageChoices=[['','不限'],['3','近3个月'],['6','近半年'],['12','近一年']];
function ageFits(b){
  if(!age)return true;
  const at=mode==='rank'?rankDay?.date:dayString(), start=starts[b.id]?.start;
  if(ageDays(start,at)===null)return false;
  const bound=new Date(at+'T00:00:00Z'), day=bound.getUTCDate();
  bound.setUTCDate(1);bound.setUTCMonth(bound.getUTCMonth()-Number(age));
  const last=new Date(Date.UTC(bound.getUTCFullYear(),bound.getUTCMonth()+1,0)).getUTCDate();
  bound.setUTCDate(Math.min(day,last));return start>=bound.toISOString().slice(0,10);
}
const el=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const option=(v,l)=>'<option value="'+esc(v)+'">'+esc(l)+'</option>';
const norm=v=>String(v||'').normalize('NFKC').toLowerCase().replace(/[\s\p{P}]/gu,'');
const number=new Intl.NumberFormat('zh-CN');
const format=n=>!Number.isFinite(n)?'暂无':n>=10000?number.format(n/10000)+' 万':number.format(n);
el('count').textContent='正在读取书目…';
const source=await fetch('./catalog.gz',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error(r.status);return new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).json()}).catch(e=>{
  el('count').textContent='书目暂时无法加载，请刷新重试';throw e;
});
const [hotFeed, daily]=await Promise.all([
  fetch('./data/hot.json',{cache:'no-cache'}).then(r=>r.json()).catch(()=>({ids:[]})),
  compressed('./history/latest-readers.gz').catch(()=>({}))
]);
const measurementDay=dayString();
let todayDetails=null,yesterdayDetails=null;
const hotOrder=new Map(hotFeed.ids.map((id,index)=>[id,index]));
for(const b of source.books){
  const sample=daily[b.id];
  if(sample && (!b.observed||sample[0]>b.observed)){
    b.observed=sample[0];b.readers=sample[1];b.readersText='';
  }
}
const books=(source?.books||[]).filter(b=>Number.isFinite(b.readers)&&b.readers>=8000);
const byBook=new Map(books.map(b=>[String(b.id),b]));
const modes={search:['搜作品','按题材、简介和阅读热度找书。'],rank:['排行榜','番茄各分类前 30 名。选择分类可查看官方名次。']};
const PAGE_SIZE=30;
let introTotal=books.filter(b=>b.intro?.trim()).length;
let category='';
let mode='search',page=1,pages=1,results=[],available=[],selectedTags=new Set(),channel='',status='',heat='all',words='all';
const heatRanges=[['all','不限'],['2','2 万以上'],['5','5 万以上'],['10','10 万以上'],['custom','自定义']];
const wordRanges=[['all','不限'],['under','30 万字以下',null,299999],['mid','30 万～50 万字',300000,499999],['high','50 万～100 万字',500000,999999],['long','100 万字以上',1000000,null],['custom','自定义']];
const categoryChannels=new Map(),mainNames=new Set();
for(const r of source?.coverage||[]){
  if(!categoryChannels.has(r.category))categoryChannels.set(r.category,new Set());
  categoryChannels.get(r.category).add(r.channel);
  if(r.kind==='主分类')mainNames.add(r.category);
}
function bookChannel(b){
  if(b.channel==='共用')return b.channelEvidence?.kind==='official-detail'?'主分类男女频共用':'男女频均收录';
  return b.channel||'';
}
const matchesChannel=(b,ch)=>!ch||b.channel===ch||b.channel==='共用';
function primaryFor(b){
  if(b.primary?.length)return b.primary;
  const verified=(b.primary||[]).filter(t=>mainNames.has(t));
  return verified.length?verified:(b.tags||[]).filter(t=>mainNames.has(t));
}
const tagIndex=new WeakMap(),textIndex=new WeakMap(),facetIndex=new Map();
function tagsFor(b,ch=''){
  if(!tagIndex.has(b))tagIndex.set(b,new Map());
  const cache=tagIndex.get(b);
  if(!cache.has(ch)){
    const names=new Set();
    for(const t of [...(b.tags||[]),...primaryFor(b)]){
      const routes=categoryChannels.get(t);
      if(t!=='全部分类'&&(!ch||!routes||routes.has(ch)))names.add(t);
    }
    for(const [c,list] of Object.entries(b.officialTags||{}))if(!ch||!c||ch===c)for(const t of list)names.add(t);
    cache.set(ch,[...names]);
  }
  return cache.get(ch);
}
function getTexts(b){
  if(!textIndex.has(b))textIndex.set(b,{title:norm(b.title),intro:norm(b.intro),author:norm(b.author),tags:tagsFor(b).map(norm)});
  return textIndex.get(b);
}
let mold=2,rankDay=null,rankDates=[],rankBooks=[],rankLookup=new Map(),rankBusy=false,rankError='',loadSequence=0;

const boardName=()=>boards.find(x=>x[0]===mold)?.[1]||'';
function pool(){return mode==='rank'?rankBooks:books}
function rebuildRank(){
  const gender=channel==='女频'?'0':'1';
  const scopes=(rankDay?.scopes||[]).filter(s=>s.gender===gender&&s.mold===mold&&s.ok);
  rankLookup=new Map();
  for(const scope of scopes)for(const row of scope.rows){
    let b=rankLookup.get(row.id);
    if(!b){
      const base=byBook.get(row.id)||{};
      b={...base,...row,observed:scope.observed,readersText:'',channel,primary:[],positions:{},intro:row.intro||base.intro,coverUrl:row.coverUrl||base.coverUrl};
      rankLookup.set(row.id,b);
    }
    b.primary.push(scope.category);b.positions[scope.category]=row.pos;
  }
  rankBooks=[...rankLookup.values()];facetIndex.clear();
  if(mold>=3){
    const snapshot=rankDay?.boards?.[mold];
    const observations=new Map();
    for(const scope of rankDay?.scopes||[]){
      for(const b of scope.rows||[])if(Number.isFinite(b.readers))observations.set(b.id,{readers:b.readers,observed:scope.observed});
    }
    rankBooks=(snapshot?.rows||[]).map(row=>{
      const base=byBook.get(row.id)||{};
      const fallback=observations.get(row.id)||(Number.isFinite(base.readers)?base:null);
      return {...base,...row,primary:row.primary?.length?row.primary:base.primary||[],tags:row.tags?.length?row.tags:base.tags||[],intro:row.intro||base.intro,channel:base.channel||'',
        coverUrl:row.coverUrl||base.coverUrl,readers:row.readers??fallback?.readers??null,observed:row.readers!=null?snapshot.observed:fallback?.observed,readersText:'',positions:{[boardName()]:row.pos}};
    });
    rankLookup=new Map(rankBooks.map(b=>[b.id,b]));
    el('rankState').textContent=rankBusy?'正在读取榜单…':rankError||(!snapshot?.rows?'该日尚无这项榜单记录':boardName()+' · 官方顺序 · '+rankBooks.length+' 本');
    el('rankRetry').hidden=!rankError;return;
  }
  const expected=channel==='女频'?18:19;
  el('rankState').textContent=rankBusy?'正在读取榜单…':rankError||('已取得 '+scopes.length+' / '+expected+' 个分类');
  el('rankRetry').hidden=!rankError;
}
async function loadRank(date){
  const sequence=++loadSequence;
  rankBusy=true;rankError='';rankDay=null;rebuildRank();applyFilters();
  try{
    if(!rankDates.length){
      const r=await fetch('./history/index.json',{cache:'no-cache'});
      if(!r.ok)throw Error(r.status);
      rankDates=(await r.json()).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d));
      el('rankDate').innerHTML=rankDates.map(d=>option(d,d)).join('');
    }
    const d=date||rankDates[0];if(!rankDates.includes(d))throw Error('日期无记录');
    el('rankDate').value=d;
    const r=await fetch('./history/'+d+'.json.gz',{cache:'no-cache'});
    if(!r.ok)throw Error(r.status);
    const snapshot=await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).json();
    if(snapshot.date!==d)throw Error('日期不符');
    if(sequence===loadSequence)rankDay=snapshot;
  }catch{if(sequence===loadSequence)rankError='当日榜单未能加载'}
  if(sequence===loadSequence){
    rankBusy=false;
    if(mode==='rank'){rebuildRank();paintControls();renderTags();applyFilters()}
  }
}

function facets(){

    facetIndex.set(key,[...counts].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'zh-CN')));

function range(id){return el(id).value===''?null:Math.round(Number(el(id).value)*10000)}
function inRange(n,low,high){return low===null&&high===null||Number.isFinite(n)&&(low===null||n>=low)&&(high===null||n<=high)}
function filters(){
  const w=wordRanges.find(x=>x[0]===words);
  const lo=words==='custom'?range('lo'):w[2]??null,hi=words==='custom'?range('hi'):w[3]??null;
  const min=heat==='custom'?range('minread'):heat==='all'?null:Number(heat)*10000,max=heat==='custom'?range('maxread'):null;
  const bad=[lo,hi,min,max].some(x=>x!==null&&(!Number.isFinite(x)||x<0))||lo!==null&&hi!==null&&lo>hi||min!==null&&max!==null&&min>max;
  const raw=submitted;
  return {lo,hi,min,max,bad,raw,terms:raw.split(/\s+/).map(norm).filter(Boolean),day:el('day').value,order:el('sort').value};
}
function match(b,terms,phrase){
  if(!terms.length)return 0;
  const t=getTexts(b);
  if(t.title===phrase)return 5;
  if(terms.every(k=>t.title.includes(k)))return 4;
  if(!terms.every(k=>t.title.includes(k)||t.intro.includes(k)||t.author.includes(k)||t.tags.some(x=>x.includes(k))))return -1;
  if(terms.some(k=>t.title.includes(k)))return 3;
  return terms.some(k=>t.intro.includes(k))?2:1;
}
function queryBooks(f){
  if(f.bad)return [];
  const scored=new Map(), phrase=norm(f.raw);
  const found=pool().filter(b=>{
    if(!ageFits(b)||!matchesChannel(b,channel)||status&&b.status!==status)return false;
    if(category&&!primaryFor(b).includes(category))return false;
    if(selectedTags.size&&![...selectedTags].every(t=>tagsFor(b,channel).includes(t)))return false;
    const belowThousand=b.readers==null&&b.readersText==='未满1000人在读';
    const knownRangeFits=belowThousand&&(f.min===null||f.min===0)&&(f.max===null||f.max>=999);
    if(!inRange(b.words,f.lo,f.hi)||(!inRange(b.readers,f.min,f.max)&&!knownRangeFits))return false;
    if(mode==='debut'&&f.day&&archiveEvent(b)?.date!==f.day)return false;
    const weight=(f.raw===b.id||f.raw.replace(/\/$/,'')==='https://fanqienovel.com/page/'+b.id)?6:match(b,f.terms,phrase);if(weight<0)return false;
    scored.set(b,weight);return true;
  });
  const val=b=>f.order==='long'?(b.words??-Infinity):f.order==='short'?-(b.words??Infinity):f.order==='gain'?(b.gain7??-Infinity):f.order==='debut'?Number((archiveEvent(b)?.date||'').replaceAll('-','')):b.readers??-Infinity;
  const pos=b=>b.positions?.[category]??Math.min(...Object.values(b.positions||{}));
  return found.sort((a,b)=>(f.order==='pos'?pos(a)-pos(b):0)||(f.order==='hot'?scored.get(b)-scored.get(a)||(hotOrder.get(a.id)??Infinity)-(hotOrder.get(b.id)??Infinity):0)||val(b)-val(a)||(b.readers??0)-(a.readers??0)||String(a.id).localeCompare(String(b.id)));
}

function link(url,label){return /^https:\/\//.test(url||'')?'<a target="_blank" rel="noopener" href="'+esc(url)+'">'+esc(label)+'</a>':''}
function coverSource(b){
  const now=Date.now();
  for(const candidate of [b.longCoverUrl,b.coverUrl]){
    if(!candidate)continue;
    try{
      const url=new URL(candidate),expiry=url.searchParams.get('x-expires');
      if(url.protocol==='https:'&&(!expiry||Number(expiry)*1000>now))return url.href;
    }catch{}
  }
  return '';
}

  b.tags=[...new Set([...tags.filter(t=>typeof t==='string'),...(b.tags||[])])];

function ageLabel(start,at,days){
  if(days<=100)return days+' 天';
  const anniversary=new Date(start+'T00:00:00Z');
  anniversary.setUTCFullYear(anniversary.getUTCFullYear()+1);
  if(Date.parse(at)<anniversary.getTime())return Math.min(11,Math.floor(days/30))+' 个月';
  return Number((days/365.2425).toFixed(1))+' 年';
}

function positionIntro(){
  if(!anchor)return;const box=anchor.getBoundingClientRect(),pop=el('introPop'),pad=10;
  if(box.bottom<=0||box.top>=innerHeight){hideIntro();return}
  pop.style.width=Math.min(540,innerWidth-2*pad)+'px';
  const below=innerHeight-box.bottom-pad-4,above=box.top-pad-4;
  const down=below>=Math.min(220,innerHeight*.4)||below>=above;
  pop.style.maxHeight=Math.max(48,Math.min(innerHeight*.48,down?below:above))+'px';
  pop.style.left=Math.max(pad,Math.min(box.left,innerWidth-pad-pop.offsetWidth))+'px';
  pop.style.top=Math.max(pad,Math.min(innerHeight-pad-pop.offsetHeight,down?box.bottom+4:box.top-4-pop.offsetHeight))+'px';
}

const visibleCards=new Set(),attemptedTags=new Set();
let loadingTags=false,tagPause=false;
async function loadVisibleTags(){
  if(loadingTags||tagPause)return;
  loadingTags=true;
  try{
    for(const card of visibleCards){
      const id=card.dataset.id,b=(mode==='rank'?rankLookup:byBook).get(id);
      if(!card.isConnected||!b||Array.isArray(todayDetails?.rows[id]?.[2])||verifiedTags.has(id)||attemptedTags.has(id))continue;
      attemptedTags.add(id);
      try{
        const r=await fetch('https://fanshu-book-media.sugary-mule-7635.chatgpt.site/book-tags/'+id);
        if([401,403,429,503].includes(r.status)||r.headers.has('retry-after')){tagPause=true;break}
        if(r.ok){
          const {tags}=await r.json();
          if(Array.isArray(tags)){
            verifiedTags.set(id,tags);mergeBookTags(b,tags);
            const shown=listing.querySelector('article[data-id="'+id+'"] .cardTags');
            if(shown)shown.innerHTML=cardTags(b);
          }
        }
      }catch{}
      await new Promise(resolve=>setTimeout(resolve,400));
    }
  }finally{loadingTags=false}
}

  const fallback='https://fanshu-book-media.sugary-mule-7635.chatgpt.site/book-cover/'+e.target.closest('article').dataset.id;
  if(e.target.getAttribute('src')!==fallback){e.target.src=fallback;return}
  const hint=document.createElement('span');hint.className='missing';hint.textContent='查看原书封面';e.target.replaceWith(hint)}},true);
function renderPage(){
  hideIntro();page=Math.min(Math.max(1,page),pages);const start=(page-1)*PAGE_SIZE;
  el('count').textContent='找到 '+number.format(results.length)+' 本作品';el('pageInput').value=page;el('pageInput').max=pages;
  el('pages').textContent='共 '+pages+' 页';el('prev').disabled=page===1;el('next').disabled=page===pages;
  tagObserver.disconnect();visibleCards.clear();
  listing.innerHTML=results.slice(start,start+PAGE_SIZE).map(bookCard).join('')||'<div class="empty">'+(source?'没有符合条件的作品，可移除部分筛选条件。':'未能打开本地书库。')+'</div>';
  listing.querySelectorAll('article').forEach(card=>tagObserver.observe(card));
}
function resetFilters(defaultHeat){
  category='';age='';submitted='';channel=mode==='rank'&&mold<3?(channel||'男频'):'';status='';selectedTags.clear();heat=defaultHeat;words='all';
  if(mode==='rank')rebuildRank();
  for(const id of ['q','day','minread','maxread','lo','hi','tagSearch'])el(id).value='';
  toggleCats(false);el('tagpanel').hidden=true;el('more').setAttribute('aria-expanded','false');paintControls();renderTags();applyFilters();
}
function changeMode(next){
  mode=next;document.body.classList.toggle('rankMode',next==='rank');el('heading').textContent=modes[mode][0];el('subtitle').textContent=modes[mode][1];
  controls('nav',Object.entries(modes).map(([k,v])=>[k,v[0]]),mode,changeMode);
  el('daywrap').hidden=mode!=='debut';
  const sorts=[['reads','在读人数 ↓']];if(mode==='search'&&hotOrder.size)sorts.unshift(['hot','书库热度']);
  if(mode==='rank')sorts.push(['pos','分类榜名次']);
  if(mode==='debut')sorts.unshift(['debut','最新首秀']);if(mode==='sweep')sorts.unshift(['gain','7 天在读增量 ↓']);
  if(mode!=='rank')sorts.push(['long','字数 ↓'],['short','字数 ↑']);el('sort').innerHTML=sorts.map(x=>option(...x)).join('');
  el('rankFields').hidden=mode!=='rank';el('rankMore').hidden=true;setExpanded(false);
  updateSavedButton();el('savedNotice').textContent='';
  if(mode==='rank'&&mold>=3)el('sort').value='pos';
  resetFilters('all');if(mode==='rank'&&!rankDay)loadRank(el('rankDate').value);
}
function setExpanded(open){
  for(const id of []){
    el(id).closest('.search,.filterrow').hidden=mode==='rank'&&!open;
  }
  el('rankMore').textContent=open?'收起筛选':'更多筛选';
  el('rankMore').setAttribute('aria-expanded',String(open));
}
el('rankMore').onclick=()=>setExpanded(el('rankMore').getAttribute('aria-expanded')==='false');
function layout(dense){
  listing.classList.toggle('dense',dense);
  el('cardView').setAttribute('aria-pressed',String(!dense));el('denseView').setAttribute('aria-pressed',String(dense));
}
el('cardView').onclick=()=>layout(false);el('denseView').onclick=()=>layout(true);
const savedInputs=['q','minread','maxread','lo','hi','sort'];
function updateSavedButton(){
  try{el('restoreFilter').hidden=!localStorage.getItem('fanshu-filter-'+mode)}catch{el('restoreFilter').hidden=true}
}
el('saveFilter').onclick=()=>{
  const values=Object.fromEntries(savedInputs.map(id=>[id,el(id).value]));
  try{
    localStorage.setItem('fanshu-filter-'+mode,JSON.stringify({channel,mold,category,status,heat,words,age,tags:[...selectedTags],values}));
    el('savedNotice').textContent='已保存在此设备';updateSavedButton();
  }catch{el('savedNotice').textContent='浏览器未允许保存'}
};
el('restoreFilter').onclick=()=>{
  try{
    const saved=JSON.parse(localStorage.getItem('fanshu-filter-'+mode));
    if(!saved)return;
    channel=saved.channel;category=saved.category;status=saved.status;heat=heatRanges.some(x=>x[0]===saved.heat)?saved.heat:'all';if(saved.heat==='1'){heat='custom';saved.values.minread='1';saved.values.maxread=''}age=saved.age||'';words=saved.words;selectedTags=new Set(saved.tags);
    if(mode==='rank'){mold=saved.mold;rebuildRank();setExpanded(true)}
    for(const id of savedInputs)el(id).value=saved.values[id];submitted=el('q').value.trim();
    paintControls();renderTags();applyFilters();el('savedNotice').textContent='已应用常用筛选';
  }catch{el('savedNotice').textContent='无法读取此设备的筛选'}
};
function togglePanel(open){el('tagpanel').hidden=!open;el('more').setAttribute('aria-expanded',String(open));renderTags();if(!open)el('more').focus()}
el('more').onclick=()=>togglePanel(el('tagpanel').hidden);el('tagSearch').oninput=renderTags;
el('clearTags').onclick=()=>{selectedTags.clear();renderTags();applyFilters()};
el('reset').onclick=()=>resetFilters('all');
for(const id of ['day','lo','hi','minread','maxread','sort'])el(id).addEventListener('input',e=>{if(!e.isComposing)applyFilters()});
el('searchForm').onsubmit=e=>{e.preventDefault();submitted=el('q').value.trim();el('q').blur();applyFilters()};
const sheet=document.querySelector('.filters');
function closeSheet(){document.body.classList.remove('sheetOpen');}
for(const b of document.querySelectorAll('[data-sheet]'))b.onclick=()=>{
 document.body.classList.add('sheetOpen');
 const focus=el(b.dataset.sheet).querySelector('button');focus?.focus({preventScroll:true});focus?.scrollIntoView({block:'nearest'})
};
el('closeSheet').onclick=closeSheet;el('applySheet').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function go(p){if(Number.isFinite(p)){page=Math.trunc(p);renderPage();el('count').scrollIntoView({block:'start'})}}
el('prev').onclick=()=>go(page-1);el('next').onclick=()=>go(page+1);el('go').onclick=()=>go(Number(el('pageInput').value));
el('pageInput').onkeydown=e=>{if(e.key==='Enter')go(Number(el('pageInput').value))};
if(source.updated) document.querySelector('.meta').textContent='书目更新 '+new Date(source.updated).toLocaleDateString('zh-CN',{timeZone:'Asia/Shanghai'});
el('size').textContent=number.format(books.length);
function coverageSummary(){
  return '<p>本书目来自本轮读取的番茄官方最热书库及分类榜单，共 '+number.format(books.length)+' 本去重作品，其中 '+number.format(introTotal)+' 本带有简介。筛选和排序在全部已收录作品中进行，封面在翻页后按需加载。</p>';
}
function toggleCats(open){
 el('catpanel').hidden=!open;el('moreCats').setAttribute('aria-expanded',String(open));
 el('moreCats').textContent=open?'收起分类':'更多分类';
}
el('moreCats').onclick=()=>toggleCats(el('catpanel').hidden);
el('closeCats').onclick=()=>{toggleCats(false);el('moreCats').focus()};
el('closeTags').onclick=()=>togglePanel(false);
el('catpanel').onkeydown=e=>{if(e.key==='Escape'){toggleCats(false);el('moreCats').focus()}};


el('coverage').innerHTML=coverageSummary();changeMode(new URLSearchParams(location.search).get('view')==='rank'?'rank':'search');
const initialCategory=new URLSearchParams(location.search).get('category');if(initialCategory)openCategory(initialCategory);

Promise.all([samples(measurementDay),samples(earlier(measurementDay,1))]).then(([current,previous])=>{
  todayDetails=current;yesterdayDetails=previous;
  if(current===null)return;
  for(const b of books){
    mergeBookTags(b,current.rows[b.id]?.[2]||previous?.rows[b.id]?.[2]);
    const value=measuredCount(current,b.id);
    if(value!==null){b.readers=value;b.readersText='';b.observed=new Date(current.rows[b.id][0]*1000).toISOString()}
  }
  renderTags();
  const oldPage=page;
  results=queryBooks(filters());pages=Math.max(1,Math.ceil(results.length/PAGE_SIZE));page=oldPage;renderPage();
  const targets=current.targets, obtained=targets.filter(id=>measuredCount(current,id)!==null).length;
  const pairs=targets.filter(id=>measuredCount(current,id)!==null&&measuredCount(previous,id)!==null).length;
  const rate=n=>targets.length?(100*n/targets.length).toFixed(1)+'%':'—';
  el('coverage').insertAdjacentHTML('beforeend','<p>今日详情实测 '+obtained+' / '+targets.length+' 本（'+rate(obtained)+'）。昨日、今日均有读数 '+pairs+' 本（'+rate(pairs)+'）。每日覆盖目标 95%。</p>');
});
</script></body></html>
